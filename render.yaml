services:
  - type: web
    name: clearglass-artemis-api
    runtime: docker
    plan: starter
    dockerfilePath: ./clearglassinc-artemis/apps/api-node/Dockerfile
    dockerContext: ./clearglassinc-artemis/apps/api-node
    healthCheckPath: /healthz
    # Idempotent schema migrations run before each API deploy.
    preDeployCommand: npm run migrate
    # GitHub Actions deploys only after its test and image-build gates pass.
    # Keeping Render auto-deploy disabled prevents an unvalidated push and the
    # deploy-hook job from racing to deploy different revisions.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clearglass-artemis-redis
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_ALLOWED_PRICE_IDS
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://www.clearglassinc.com/payment/success?session_id={CHECKOUT_SESSION_ID}
      - key: STRIPE_CANCEL_URL
        value: https://www.clearglassinc.com/payment/cancelled
      - key: ARTEMIS_ADMIN_API_TOKEN
        sync: false
      - key: ARTEMIS_OPERATOR_API_TOKEN
        sync: false
      - key: ARTEMIS_INGEST_API_TOKEN
        sync: false
      - key: GUMROAD_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://www.clearglassinc.com
      - key: DATABASE_URL
        fromDatabase:
          name: clearglass-subscribers-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: STRIPE_PRICE_SIGNAL_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SIGNAL_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ASSURANCE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ASSURANCE_ANNUAL
        sync: false
      - key: STRIPE_PRICE_NORTHSTAR_ENTERPRISE
        sync: false
      - key: SITE_BASE_URL
        value: https://www.clearglassinc.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: worker
    name: clearglass-stripe-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./clearglassinc-artemis/apps/api-node/Dockerfile
    dockerContext: ./clearglassinc-artemis/apps/api-node
    dockerCommand: npm run worker
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clearglass-artemis-redis
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PROCESSED_EVENT_TTL_SECONDS
        value: "31536000"
      - key: DATABASE_URL
        fromDatabase:
          name: clearglass-subscribers-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: STRIPE_PRICE_SIGNAL_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SIGNAL_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ASSURANCE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ASSURANCE_ANNUAL
        sync: false
      - key: STRIPE_PRICE_NORTHSTAR_ENTERPRISE
        sync: false
      - key: SITE_BASE_URL
        value: https://www.clearglassinc.com

  - type: keyvalue
    name: clearglass-artemis-redis
    plan: starter
    ipAllowList: []

databases:
  - name: clearglass-subscribers-db
    plan: basic-256mb
    databaseName: clearglass_subscribers
    user: clearglass_app
    ipAllowList: []
