version: 2.1

jobs:
  validate-artemis-api:
    docker:
      - image: cimg/node:20.19
      - image: redis:7-alpine
    environment:
      REDIS_URL: redis://localhost:6379/15
      STRIPE_REDIS_INTEGRATION_TESTS: "true"
      STRIPE_E2E_REDIS_URL: redis://localhost:6379/14
      STRIPE_E2E_INTEGRATION_TESTS: "true"
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install API dependencies
          command: cd clearglassinc-artemis/apps/api-node && npm install
      - run:
          name: Test Stripe webhook security and API helpers
          command: cd clearglassinc-artemis/apps/api-node && npm test

workflows:
  validate:
    jobs:
      - validate-artemis-api
