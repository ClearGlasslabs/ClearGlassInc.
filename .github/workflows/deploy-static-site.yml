name: Deploy allowlisted static site
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "legal.html"
      - "pricing.html"
      - "assets/**"
      - ".well-known/**"
      - "security.txt"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - "_headers"
      - ".github/workflows/deploy-static-site.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Assemble explicit public artifact
        run: |
          set -eu
          mkdir -p public/.well-known public/assets
          cp index.html 404.html legal.html pricing.html security.txt robots.txt sitemap.xml .nojekyll public/
          cp .well-known/security.txt public/.well-known/security.txt
          cp assets/site.css assets/site.js assets/legal.css assets/global-bar.css assets/pricing.css assets/pricing.js assets/organization.json public/assets/
          if find public -type f \( -name '*.map' -o -name '.env*' -o -name '*.key' -o -name '*.pem' \) -print -quit | grep .; then exit 1; fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: public }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact allowlisted artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
