name: Deploy allowlisted static site
on:
  push:
    branches: [main]
    paths: ["index.html", "404.html", "legal.html", "assets/**", ".well-known/**", "security.txt", "robots.txt", "sitemap.xml", "CNAME", "_headers", ".github/workflows/deploy-static-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble explicit public artifact
        run: |
          set -eu
          mkdir -p public/.well-known public/assets
          cp index.html 404.html legal.html security.txt robots.txt sitemap.xml CNAME .nojekyll public/
          cp .well-known/security.txt public/.well-known/security.txt
          cp assets/site.css assets/site.js assets/legal.css assets/organization.json public/assets/
          if find public -type f \( -name '*.map' -o -name '.env*' -o -name '*.key' -o -name '*.pem' \) -print -quit | grep .; then exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact allowlisted artifact
        id: deployment
        uses: actions/deploy-pages@v4
