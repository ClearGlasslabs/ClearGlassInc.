name: Artemis Intelligence Validation

on:
  push:
    branches: [main]
    paths:
      - "artemis/intelligence/**"
      - ".github/workflows/artemis-intelligence.yml"
  pull_request:
    paths:
      - "artemis/intelligence/**"
      - ".github/workflows/artemis-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artemis-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install validation dependencies
        # Pinned: an unpinned ruff picked up new default rules between two
        # pushes and turned an unchanged file red. Bump these deliberately.
        run: python -m pip install --upgrade pip && python -m pip install "ruff==0.16.8" "mypy==2.3.1" "pytest==9.1.1"

      - name: Compile source
        run: python -m compileall -q artemis/intelligence

      - name: Lint
        run: ruff check artemis/intelligence

      - name: Type check
        run: mypy --strict artemis/intelligence/core.py

      - name: Test
        # Invoke pytest through the selected interpreter so the repository root
        # remains on sys.path when pytest is installed as a console script.
        run: python -m pytest artemis/intelligence/test_core.py -q
