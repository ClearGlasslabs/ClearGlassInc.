name: Publish Ledger of Ashes Homepage Section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-book-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject dedicated book section into homepage
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- CLEARGLASS_BOOK_SECTION -->'

          if marker in html:
              print('Ledger of Ashes homepage section already present.')
              raise SystemExit(0)

          # The current ClearGlass homepage intentionally uses a plain <main>
          # element. Do not mutate or redesign the homepage when the historical
          # insertion anchor is absent; leave the existing production composition intact.
          anchor = '<main id="nexus">'
          if anchor not in html:
              print('Historical homepage anchor is absent; preserving current homepage unchanged.')
              raise SystemExit(0)

          section = r'''<!-- CLEARGLASS_BOOK_SECTION -->
          <style id="ledger-book-home-style">
          .ledger-book-home{margin:44px auto;max-width:1180px;padding:clamp(28px,5vw,58px);border:1px solid #5b4730;border-radius:18px;background:linear-gradient(135deg,#17120c,#0d1117 58%,#090c10);position:relative;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.3)}
          .ledger-book-home:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 15%,rgba(214,179,106,.14),transparent 34%);pointer-events:none}
          .ledger-book-home>*{position:relative}.ledger-book-kicker{color:#d6b36a;font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.ledger-book-home h2{font-family:Georgia,serif;font-size:clamp(2.5rem,6vw,5rem);line-height:.95;letter-spacing:-.045em;margin:16px 0 12px;color:#e8edf3}.ledger-book-home p{max-width:800px;color:#c5cdd6;font-size:1.05rem;line-height:1.7}.ledger-book-home .ledger-tag{font-size:clamp(1.15rem,2.5vw,1.5rem);color:#f0f2f5}.ledger-book-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.ledger-book-btn{display:inline-block;padding:12px 18px;border-radius:8px;border:1px solid #5b4730;background:#17120b;color:#f5e6c1;text-decoration:none;font-weight:750}.ledger-book-btn.secondary{border-color:#242c36;background:#0d1117;color:#e8edf3}.ledger-book-meta{margin-top:18px!important;color:#9aa6b2!important;font-size:.78rem!important;letter-spacing:.04em}
          </style>
          <section class="ledger-book-home" id="ledger-of-ashes" aria-labelledby="ledger-book-title">
            <div class="ledger-book-kicker">FEATURED BOOK · FICTIONAL THRILLER</div>
            <h2 id="ledger-book-title">The Ledger of Ashes</h2>
            <p class="ledger-tag"><strong>The thriller that will make you question every black SUV.</strong></p>
            <p>They killed the founder. Now they're coming for the CEO. And they want you to watch.</p>
            <p>A dedicated home for the story of Eleanor Vance, Julian Mercer, the fictional Harrow Group, a hidden ledger, and three people who refuse to look away.</p>
            <div class="ledger-book-actions">
              <a class="ledger-book-btn" href="/blog.html#the-ledger-of-ashes">Explore the book</a>
              <a class="ledger-book-btn secondary" href="/blog.html#book-feature">Read the feature</a>
            </div>
            <p class="ledger-book-meta">FICTIONAL WORK · CHARACTERS, ORGANIZATIONS, OPERATIONS AND EVENTS ARE INVENTED</p>
          </section>
          <!-- /CLEARGLASS_BOOK_SECTION -->'''

          html = html.replace(anchor, section + '\n\n  ' + anchor, 1)
          path.write_text(html, encoding='utf-8')
          print('Ledger of Ashes section injected into index.html.')

      - name: Commit homepage publication
        run: |
          git config user.name "ClearGlassInc Publisher"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publish Ledger of Ashes book section on homepage"
          git push
