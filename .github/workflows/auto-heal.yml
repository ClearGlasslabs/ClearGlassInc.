name: Auto Heal

on:
  workflow_run:
    # GitHub rejects a workflow_run trigger without this list, which left the
    # whole file invalid: no schedule, dispatch or failure run ever started.
    # Names must match each workflow's `name:` exactly.
    workflows:
      - Artemis Intelligence Validation
      - CAPE Prompt Optimization
      - ClearGlass Platform CI
      - Deploy Artemis API
      - Graph Engineering CI
      - Publish Ledger of Ashes Homepage Section
      - Repository Health
      - Security Baseline
      - Visual Regression
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  heal:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.name != 'Auto Heal')
    uses: ClearGlasslabs/workflow-artifacts/.github/workflows/reusable-auto-heal.yml@3b471303b256ad571448d58d9c81a411a828c3c4
    with:
      run_id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
