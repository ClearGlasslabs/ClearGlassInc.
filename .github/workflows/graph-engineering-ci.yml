name: Graph Engineering CI

on:
  pull_request:
    branches: [main]
    paths:
      - "orchestration/graph_engineering/**"
      - ".github/workflows/graph-engineering-ci.yml"
  push:
    branches: [main]
    paths:
      - "orchestration/graph_engineering/**"
      - ".github/workflows/graph-engineering-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graph-engineering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compile
        run: |
          python -m py_compile orchestration/graph_engineering/core.py
          python -m py_compile orchestration/graph_engineering/cli.py

      - name: Unit tests
        run: python -m unittest discover -s orchestration/graph_engineering/tests -v

      - name: Planner smoke test
        run: |
          python -m orchestration.graph_engineering.cli plan \
            --mission "Determine the strongest evidence-backed cybersecurity service ClearGlassInc can sell to Ontario SMEs in 2026." \
            > /tmp/graph-plan.json
          python -m json.tool /tmp/graph-plan.json > /dev/null
