name: Deploy Artemis API

on:
  push:
    branches: [main]
    paths:
      - "clearglassinc-artemis/apps/api-node/**"
      - "render.yaml"
      - ".github/workflows/deploy-artemis-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "clearglassinc-artemis/apps/api-node/**"
      - "render.yaml"
      - ".github/workflows/deploy-artemis-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artemis-api-production
  cancel-in-progress: false

env:
  APP_DIR: clearglassinc-artemis/apps/api-node

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDIS_URL: redis://localhost:6379/15
      STRIPE_REDIS_INTEGRATION_TESTS: "true"
      STRIPE_E2E_REDIS_URL: redis://localhost:6379/14
      STRIPE_E2E_INTEGRATION_TESTS: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/artemis_ci
      SUBSCRIPTIONS_PG_TEST_URL: postgres://postgres:postgres@localhost:5432/artemis_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artemis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Syntax check
        working-directory: ${{ env.APP_DIR }}
        run: npm run check

      - name: Apply database migrations (twice, to prove idempotency)
        working-directory: ${{ env.APP_DIR }}
        run: npm run migrate && npm run migrate

      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      - name: Build production container
        run: docker build --tag clearglass-artemis-api:${{ github.sha }} "${APP_DIR}"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Require Render API and worker deploy hooks
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi
          if [ -z "$RENDER_WORKER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_WORKER_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi

      - name: Trigger exact-commit deployment for API and worker
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          trigger_deploy() {
            hook_url="$1"
            separator='?'
            case "$hook_url" in *\?*) separator='&' ;; esac
            curl --fail --show-error --silent --request POST \
              "${hook_url}${separator}ref=${GITHUB_SHA}"
          }
          trigger_deploy "$RENDER_DEPLOY_HOOK_URL"
          trigger_deploy "$RENDER_WORKER_DEPLOY_HOOK_URL"
